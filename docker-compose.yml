services:
  web:
    build:
      context: ./web
    environment:
      APP_ORIGIN: ${WEB_APP_ORIGIN:-http://localhost:3001}
      RAG_API_URL: http://api:8000
      AUTH_URL: ${WEB_APP_ORIGIN:-http://localhost:3001}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${WEB_AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      WEB_IDENTITY_DIRECTORY_JSON: ${WEB_IDENTITY_DIRECTORY_JSON:-}
      FARO_COLLECTOR_URL: ${FARO_COLLECTOR_URL:-}
      RELEASE_VERSION: ${RELEASE_VERSION:-local}
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: .
    environment:
      APP_ENV: development
      RELEASE_VERSION: ${RELEASE_VERSION:-local}
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag_runtime@db:5432/enterprise_rag}
      REDIS_URL: ${REDIS_URL:-redis://state:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://cache:6379/0}
      BLOB_BACKEND: ${BLOB_BACKEND:-local}
      BLOB_LOCAL_ROOT: /var/lib/rag/blobs
      BLOB_BUCKET: ${BLOB_BUCKET:-enterprise-rag-local}
      BLOB_ENDPOINT_URL: ${BLOB_ENDPOINT_URL:-}
      BLOB_REGION: ${BLOB_REGION:-us-east-1}
      BLOB_ACCESS_KEY_ID: ${BLOB_ACCESS_KEY_ID:-}
      BLOB_SECRET_ACCESS_KEY: ${BLOB_SECRET_ACCESS_KEY:-}
      BLOB_MAX_UPLOAD_BYTES: ${BLOB_MAX_UPLOAD_BYTES:-104857600}
      BLOB_MAX_PAGES: ${BLOB_MAX_PAGES:-250}
      INGESTION_MAX_QUEUE_SIZE: ${INGESTION_MAX_QUEUE_SIZE:-500}
      INGESTION_MAX_CONCURRENCY: ${INGESTION_MAX_CONCURRENCY:-2}
      INGESTION_CHUNK_CHARS: ${INGESTION_CHUNK_CHARS:-2400}
      INGESTION_CHUNK_OVERLAP_CHARS: ${INGESTION_CHUNK_OVERLAP_CHARS:-300}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-20}
      GENERATION_MODEL: ${GENERATION_MODEL:-gemini-3.8-flash}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-20}
      GENERATION_MAX_OUTPUT_TOKENS: ${GENERATION_MAX_OUTPUT_TOKENS:-1024}
      GENERATION_MAX_CONCURRENCY: ${GENERATION_MAX_CONCURRENCY:-8}
      GENERATION_ENABLED: ${GENERATION_ENABLED:-true}
      QUERY_CONTEXT_TOKEN_BUDGET: ${QUERY_CONTEXT_TOKEN_BUDGET:-6000}
      QUERY_MINIMUM_SIMILARITY: ${QUERY_MINIMUM_SIMILARITY:-0.35}
      QUERY_CACHE_TTL_SECONDS: ${QUERY_CACHE_TTL_SECONDS:-300}
      AI_INPUT_PII_ACTION: ${AI_INPUT_PII_ACTION:-flag}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-local-development-scrape-token-change-before-use-001}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-rag-development}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_SAMPLE_RATE: ${LANGSMITH_SAMPLE_RATE:-1.0}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MEMORY_FALLBACK_REQUESTS: ${RATE_LIMIT_MEMORY_FALLBACK_REQUESTS:-10}
      RATE_LIMIT_MEMORY_FALLBACK_WINDOW_SECONDS: ${RATE_LIMIT_MEMORY_FALLBACK_WINDOW_SECONDS:-60}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    volumes:
      - document_blobs:/var/lib/rag/blobs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      state:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - default
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
    command: ["arq", "rag.workers.ingestion.WorkerSettings"]
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag_runtime@db:5432/enterprise_rag}
      REDIS_URL: ${REDIS_URL:-redis://state:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://cache:6379/0}
      BLOB_BACKEND: ${BLOB_BACKEND:-local}
      BLOB_LOCAL_ROOT: /var/lib/rag/blobs
      BLOB_BUCKET: ${BLOB_BUCKET:-enterprise-rag-local}
      BLOB_ENDPOINT_URL: ${BLOB_ENDPOINT_URL:-}
      BLOB_REGION: ${BLOB_REGION:-us-east-1}
      BLOB_ACCESS_KEY_ID: ${BLOB_ACCESS_KEY_ID:-}
      BLOB_SECRET_ACCESS_KEY: ${BLOB_SECRET_ACCESS_KEY:-}
      BLOB_MAX_UPLOAD_BYTES: ${BLOB_MAX_UPLOAD_BYTES:-104857600}
      BLOB_MAX_PAGES: ${BLOB_MAX_PAGES:-250}
      INGESTION_MAX_QUEUE_SIZE: ${INGESTION_MAX_QUEUE_SIZE:-500}
      INGESTION_MAX_CONCURRENCY: ${INGESTION_MAX_CONCURRENCY:-2}
      INGESTION_CHUNK_CHARS: ${INGESTION_CHUNK_CHARS:-2400}
      INGESTION_CHUNK_OVERLAP_CHARS: ${INGESTION_CHUNK_OVERLAP_CHARS:-300}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-20}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9000}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    volumes:
      - document_blobs:/var/lib/rag/blobs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      state:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - backend

  migrator:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+asyncpg://rag_migrator@db:5432/enterprise_rag}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    volumes:
      - ./:/app
    networks:
      - backend

  db:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_DB: enterprise_rag
      POSTGRES_USER: rag_migrator
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init_roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_migrator -d enterprise_rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  state:
    image: redis:8.2-alpine@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  cache:
    image: redis:8.2-alpine@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    profiles: ["observability"]
    networks: [backend]

  alloy:
    image: grafana/alloy:v1.12.2
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
    environment:
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-local-development-scrape-token-change-before-use-001}
    volumes:
      - ./observability/alloy.config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - prometheus
    profiles: ["observability"]
    networks: [backend]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-development-password-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    profiles: ["observability"]
    networks: [backend]

volumes:
  postgres_data:
  document_blobs:

networks:
  default:
    name: enterprisesragplatform_default
  backend:
    internal: true
