services:
  api:
    build:
      context: .
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag_runtime@db:5432/enterprise_rag}
      REDIS_URL: ${REDIS_URL:-redis://state:6379/0}
      BLOB_BACKEND: ${BLOB_BACKEND:-local}
      BLOB_LOCAL_ROOT: /var/lib/rag/blobs
      BLOB_BUCKET: ${BLOB_BUCKET:-enterprise-rag-local}
      BLOB_ENDPOINT_URL: ${BLOB_ENDPOINT_URL:-}
      BLOB_REGION: ${BLOB_REGION:-us-east-1}
      BLOB_ACCESS_KEY_ID: ${BLOB_ACCESS_KEY_ID:-}
      BLOB_SECRET_ACCESS_KEY: ${BLOB_SECRET_ACCESS_KEY:-}
      BLOB_MAX_UPLOAD_BYTES: ${BLOB_MAX_UPLOAD_BYTES:-104857600}
      BLOB_MAX_PAGES: ${BLOB_MAX_PAGES:-250}
      INGESTION_MAX_QUEUE_SIZE: ${INGESTION_MAX_QUEUE_SIZE:-500}
      INGESTION_MAX_CONCURRENCY: ${INGESTION_MAX_CONCURRENCY:-2}
      INGESTION_CHUNK_CHARS: ${INGESTION_CHUNK_CHARS:-2400}
      INGESTION_CHUNK_OVERLAP_CHARS: ${INGESTION_CHUNK_OVERLAP_CHARS:-300}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-20}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MEMORY_FALLBACK_REQUESTS: ${RATE_LIMIT_MEMORY_FALLBACK_REQUESTS:-10}
      RATE_LIMIT_MEMORY_FALLBACK_WINDOW_SECONDS: ${RATE_LIMIT_MEMORY_FALLBACK_WINDOW_SECONDS:-60}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    volumes:
      - document_blobs:/var/lib/rag/blobs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      state:
        condition: service_healthy
    networks:
      - default
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
    command: ["arq", "rag.workers.ingestion.WorkerSettings"]
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag_runtime@db:5432/enterprise_rag}
      REDIS_URL: ${REDIS_URL:-redis://state:6379/0}
      BLOB_BACKEND: ${BLOB_BACKEND:-local}
      BLOB_LOCAL_ROOT: /var/lib/rag/blobs
      BLOB_BUCKET: ${BLOB_BUCKET:-enterprise-rag-local}
      BLOB_ENDPOINT_URL: ${BLOB_ENDPOINT_URL:-}
      BLOB_REGION: ${BLOB_REGION:-us-east-1}
      BLOB_ACCESS_KEY_ID: ${BLOB_ACCESS_KEY_ID:-}
      BLOB_SECRET_ACCESS_KEY: ${BLOB_SECRET_ACCESS_KEY:-}
      BLOB_MAX_UPLOAD_BYTES: ${BLOB_MAX_UPLOAD_BYTES:-104857600}
      BLOB_MAX_PAGES: ${BLOB_MAX_PAGES:-250}
      INGESTION_MAX_QUEUE_SIZE: ${INGESTION_MAX_QUEUE_SIZE:-500}
      INGESTION_MAX_CONCURRENCY: ${INGESTION_MAX_CONCURRENCY:-2}
      INGESTION_CHUNK_CHARS: ${INGESTION_CHUNK_CHARS:-2400}
      INGESTION_CHUNK_OVERLAP_CHARS: ${INGESTION_CHUNK_OVERLAP_CHARS:-300}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-20}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    volumes:
      - document_blobs:/var/lib/rag/blobs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      state:
        condition: service_healthy
    networks:
      - backend

  migrator:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+asyncpg://rag_migrator@db:5432/enterprise_rag}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    volumes:
      - ./:/app
    networks:
      - backend

  db:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_DB: enterprise_rag
      POSTGRES_USER: rag_migrator
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init_roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_migrator -d enterprise_rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  state:
    image: redis:8.2-alpine@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  cache:
    image: redis:8.2-alpine@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

volumes:
  postgres_data:
  document_blobs:

networks:
  default:
    name: enterprisesragplatform_default
  backend:
    internal: true
