name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --all-groups --locked

      - name: Ruff lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Strict typing and architecture contracts
        run: |
          uv run mypy src
          uv run lint-imports

      - name: Unit tests and coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report --fail-under=80

      - name: Dependency audit
        run: uv run pip-audit --skip-editable

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build hardened API image
        run: docker build --tag enterprise-rag-api:ci .

