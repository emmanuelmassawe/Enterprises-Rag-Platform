name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_DB: enterprise_rag
          POSTGRES_USER: rag_migrator
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_migrator -d enterprise_rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.2-alpine@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Terraform
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace/infra/terraform hashicorp/terraform:1.17.2 fmt -check -recursive
          docker run --rm -v "$PWD:/workspace" -w /workspace/infra/terraform hashicorp/terraform:1.17.2 init -backend=false -input=false
          docker run --rm -v "$PWD:/workspace" -w /workspace/infra/terraform hashicorp/terraform:1.17.2 validate

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --all-groups --locked

      - name: Prepare least-privilege runtime role
        run: >-
          docker exec "${{ job.services.postgres.id }}" psql -U rag_migrator -d enterprise_rag
          -v ON_ERROR_STOP=1
          -c "CREATE ROLE rag_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE enterprise_rag TO rag_runtime"

      - name: Apply schema and verify row security
        env:
          MIGRATION_DATABASE_URL: postgresql+asyncpg://rag_migrator@localhost:5432/enterprise_rag
        run: |
          uv run alembic upgrade head
          docker exec "${{ job.services.postgres.id }}" psql -U rag_migrator -d enterprise_rag -v ON_ERROR_STOP=1 -c "INSERT INTO tenants(id,name) VALUES ('00000000-0000-0000-0000-000000000001','synthetic-a'),('00000000-0000-0000-0000-000000000002','synthetic-b')"
          visible_count="$(docker exec "${{ job.services.postgres.id }}" psql -U rag_runtime -d enterprise_rag -qAt -v ON_ERROR_STOP=1 -c "SET app.tenant_id='00000000-0000-0000-0000-000000000001'; SELECT count(*) FROM tenants")"
          test "$visible_count" = "1"
          rls_count="$(docker exec "${{ job.services.postgres.id }}" psql -U rag_migrator -d enterprise_rag -qAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_class WHERE relnamespace='public'::regnamespace AND relkind='r' AND relname IN ('tenants','users','api_keys','idempotency_records','collections','documents','chunks','jobs','conversations','messages','query_logs') AND relrowsecurity AND relforcerowsecurity")"
          test "$rls_count" = "11"
          create_privilege="$(docker exec "${{ job.services.postgres.id }}" psql -U rag_migrator -d enterprise_rag -At -v ON_ERROR_STOP=1 -c "SELECT has_schema_privilege('rag_runtime','public','CREATE')")"
          test "$create_privilege" = "f"
          uv run alembic upgrade head
          tenant_count="$(docker exec "${{ job.services.postgres.id }}" psql -U rag_migrator -d enterprise_rag -qAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM tenants")"
          test "$tenant_count" = "2"
          test "$(docker exec "${{ job.services.redis.id }}" redis-cli ping)" = "PONG"
          if docker exec "${{ job.services.postgres.id }}" psql -U rag_runtime -d enterprise_rag -v ON_ERROR_STOP=1 -c "SET app.tenant_id='00000000-0000-0000-0000-000000000001'; INSERT INTO tenants(id,name) VALUES ('00000000-0000-0000-0000-000000000003','synthetic-cross-tenant')"; then
            echo "cross-tenant insert unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Ruff lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Strict typing and architecture contracts
        run: |
          uv run mypy src
          uv run lint-imports

      - name: Unit tests and coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report --fail-under=80

      - name: AI red-team smoke suite
        run: uv run pytest -q tests/security

      - name: Dependency audit
        run: uv run pip-audit --skip-editable

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build hardened API image
        run: docker build --tag enterprise-rag-api:ci .

      - name: Set up Node.js for web quality gates
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Lint, type-check, and build the web application
        working-directory: web
        run: |
          npm run lint
          npm run typecheck
          npm run build

